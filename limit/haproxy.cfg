global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5000
    timeout client  86400000
    timeout server  86400000

frontend stats
    mode http
    bind *:222-1000 tfo
    stats enable
    stats uri /
    stats refresh 5s

frontend http-in
    mode http
    bind abns@haproxy-http accept-proxy tfo
    bind *:80 tfo
    bind *:55 tfo
    bind *:8080 tfo
    bind *:8880 tfo
    bind *:2095 tfo
    bind *:2082 tfo
    bind *:2086 tfo
    bind abns@haproxy-https accept-proxy ssl crt /etc/haproxy/hap.pem alpn h2,http/1.1 tfo

    # Deteksi WebSocket & Upgrade SSH
    acl this_payload payload(0,7) -m bin 5353482d322e30 # SSH-2.0
    acl this_payload hdr(Upgrade) -i websocket
    acl this_payload hdr_beg(Host) -i xxx
    acl up-to ssl_fc_alpn -i h2
    acl chk-02_up hdr(Upgrade) -i websocket
    acl chk-02_ws hdr_beg(Host) -i xxx

    # Urutan Routing: Prioritaskan SSH Payload sebelum Path Reguler
    use_backend GRUP_FTVPN if up-to
    use_backend BOT_FTVPN if this_payload
    use_backend FTVPN if chk-02_up chk-02_ws
    use_backend FTVPN if { path_reg -i ^/(.*) }
    default_backend CHANNEL_FTVPN

backend BOT_FTVPN
    mode tcp
    server srv-ssh 127.0.0.1:10015

backend FTVPN
    server srv-ws 127.0.0.1:1010 send-proxy check

backend GRUP_FTVPN
    server srv-grpc 127.0.0.1:1013 send-proxy check

backend CHANNEL_FTVPN
    server srv-ovpn 127.0.0.1:1194 check
    server srv-ovpn-ws 127.0.0.1:1012 send-proxy check

backend recir_http
    server loopback-for-http abns@haproxy-http send-proxy-v2 check

backend recir_https
    server loopback-for-https abns@haproxy-https send-proxy-v2 check

backend recir_https_www
    server srv-http 127.0.0.1:2223 check
